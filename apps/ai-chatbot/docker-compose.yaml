version: '3.9'

services:
  postgres:
    image: postgres:16

    container_name: ai-chatbot-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: clorisdb

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: ai-chatbot-redis

    restart: unless-stopped

    ports:
      - '6379:6379'

    # 内存上限 + allkeys-lru：进程级兜底（应用层另有按条数的 LRU ZSET）
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data
    # 可选：需要密码时取消注释
    # command: redis-server --requirepass 你的密码

volumes:
  postgres_data:
  redis_data:
